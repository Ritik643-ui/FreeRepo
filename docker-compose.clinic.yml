version: '3.8'

services:
  # PostgreSQL Database
  clinic-db:
    image: postgres:15-alpine
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_db
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  clinic-redis:
    image: redis:7-alpine
    container_name: clinic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - clinic_redis_data:/data
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Spring Boot Backend
  clinic-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: clinic-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://clinic-db:5432/clinic_db
      SPRING_DATASOURCE_USERNAME: clinic_user
      SPRING_DATASOURCE_PASSWORD: clinic_password
      SPRING_REDIS_HOST: clinic-redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: clinic-development-secret-key-change-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:19006
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - clinic_maven_cache:/home/appuser/.m2
    networks:
      - clinic-network
    depends_on:
      clinic-db:
        condition: service_healthy
      clinic-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy (Optional)
  clinic-nginx:
    image: nginx:alpine
    container_name: clinic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - clinic-network
    depends_on:
      - clinic-backend
    profiles:
      - production

volumes:
  clinic_postgres_data:
    driver: local
  clinic_redis_data:
    driver: local
  clinic_maven_cache:
    driver: local

networks:
  clinic-network:
    driver: bridge
    name: clinic-network
